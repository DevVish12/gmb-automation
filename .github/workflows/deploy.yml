
name: Deploy GMB Automation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /var/www/gmb-automation

            # Preserve local production data before updating code.
            if [ -f gmb_automation.db ]; then
              cp -a gmb_automation.db "/tmp/gmb_automation.db.backup-$(date +%Y%m%d%H%M%S)"
            fi

            if [ -d tokens ]; then
              tar -czf "/tmp/gmb-tokens-backup-$(date +%Y%m%d%H%M%S).tar.gz" tokens
            fi

            # Fail instead of overwriting uncommitted production changes.
            if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Working tree has local changes; refusing to deploy."
              git status --short
              exit 1
            fi

            git pull --ff-only origin main

            /var/www/gmb-automation/.venv/bin/pip install -r requirements.txt

            cd frontend
            npm install
            npm run build
            cd ..

            sudo -n systemctl restart gmb-automation
            sleep 5

            if ! curl -sf --max-time 10 http://127.0.0.1:5003/api/status; then
              echo "ERROR: GMB health check failed."
              exit 1
            fi

            echo
            echo "GMB Automation deployment and health check succeeded."
